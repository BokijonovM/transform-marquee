<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>transform-marquee: a before/after marquee for React</title>
    <meta
      name="description"
      content="A React marquee where every chip wipes from a before to an after state as it crosses the centre line."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='8' width='26' height='16' rx='8' fill='%23f5f6f8' stroke='%233f93c6' stroke-width='2' stroke-dasharray='3 2.5'/%3E%3Cpath d='M16 8h5a8 8 0 0 1 0 16h-5z' fill='%23131a33'/%3E%3Cpath d='M16 3v26' stroke='%23e8391d' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint so the page never flashes the wrong one.
      try {
        var saved = localStorage.getItem("tm-theme");
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
